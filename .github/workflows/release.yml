name: Build and Release

# Builds a release APK and App Bundle whenever the version in app.json is
# bumped on master, and publishes both as a GitHub release tagged v<version>.
# Everything runs on the GitHub runner: expo prebuild generates /android,
# Gradle builds and signs (no cloud build service, no Expo account).
#
# Signing (docs/release.md): with the repository secrets
#   ANDROID_KEYSTORE           the Play upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its store password
#   ANDROID_KEY_ALIAS          the key alias inside it
#   ANDROID_KEY_PASSWORD       the key password
# the builds are signed with the upload key (the .aab can go to Google Play).
# Without them they are signed with a debug key: installable for a test, not
# as an update of a Play install, and not accepted by Play.

on:
  push:
    branches:
      - master
    paths:
      - app.json
  workflow_dispatch:   # manual "Run workflow" button — always builds

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare app.json version with previous commit
        id: diff
        run: |
          CURRENT=$(jq -r '.expo.version' app.json)
          PREVIOUS=$(git show HEAD~1:app.json 2>/dev/null | jq -r '.expo.version' || echo "")
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual run, building v$CURRENT."
          elif [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version bump detected: $PREVIOUS -> $CURRENT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($CURRENT), skipping release."
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # React Native 0.81 builds with JDK 17. The Android SDK is preinstalled
      # on the runner (ANDROID_HOME); Gradle fetches missing platforms itself.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # /android is gitignored; the config plugins in plugins/ (release
      # signing among them) are applied here.
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install

      # The keystore goes to a temp file; its path reaches Gradle through
      # GITHUB_ENV and the passwords only as environment variables of the
      # build step (plugins/withAndroidSigning.js reads them), never on disk.
      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/sprig-upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sprig-upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the upload key."
          else
            echo "::notice title=Debug-signed build::The ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets are not set: the APK and AAB are signed with a debug key and the AAB cannot be uploaded to Google Play (see docs/release.md)."
          fi

      - name: Build APK and App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Incomplete secrets: debug-signed, as the notice above says.
          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ]; then
            unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          fi
          ./gradlew assembleRelease bundleRelease

      - name: Name the outputs
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk "build-output/Sprig-v$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "build-output/Sprig-v$VERSION.aab"
          ls -l build-output
          # Compare with Play Console → Test and release → App integrity → Upload key certificate.
          echo "Signing certificate of the App Bundle:"
          keytool -printcert -jarfile "build-output/Sprig-v$VERSION.aab" | grep -E 'Owner:|SHA256:' || true

      - name: Release notes from versionshinweis.txt
        run: |
          awk '/<\/en-US>/ { f = 0 } f { print } /<en-US>/ { f = 1 }' versionshinweis.txt > build-output/release-notes.md
          cat build-output/release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=("build-output/Sprig-v$VERSION.apk" "build-output/Sprig-v$VERSION.aab")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${FILES[@]}" --clobber
          else
            if [ -s build-output/release-notes.md ]; then
              NOTES=(--notes-file build-output/release-notes.md)
            else
              NOTES=(--generate-notes)
            fi
            gh release create "v$VERSION" \
              "${FILES[@]}" \
              --title "Sprig v$VERSION" \
              "${NOTES[@]}" \
              --target "$GITHUB_SHA"
          fi

      - name: Upload APK and AAB as workflow artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprig-v${{ needs.check-version.outputs.version }}
          path: |
            build-output/Sprig-*.apk
            build-output/Sprig-*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/sprig-upload.jks"
